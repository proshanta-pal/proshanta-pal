
name: GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Snake
        uses: Platane/snk@v3
        with:
          github_user_name: proshanta-pal
          outputs: |
            dist/github-snake.svg?color_snake=%238b5cf6&color_dots=%23ebedf0,%23dbeafe,%2393c5fd,%233b82f6,%231d4ed8
            dist/github-snake-dark-custom.svg?color_snake=%23c4b5fd&color_dots=%233b4252,%234c3d75,%236b35b5,%23945cf5,%23d8b4fe
            dist/github-snake-ocean.gif?color_snake=orange&color_dots=%23ebedf0,%23bfd6f6,%238dbdff,%234b91f1,%233c7dd9&color_background=%230d1117

      - name: Deploy snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
